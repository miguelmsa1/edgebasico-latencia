services:
  frontend:
    build: .
    image: ghcr.io/miguelmsa1/edgebasico-latencia-frontend:latest
    container_name: hello-edge-frontend
    environment:
      REGION: "${REGION:-Bilbao}"
      APP_EDGE_WS_URL: "${APP_EDGE_WS_URL:-}"
      LOCAL_BACKEND_PORT: "${LOCAL_BACKEND_PORT:-8080}"
      EDGE_MADRID_WS_URL: "${EDGE_MADRID_WS_URL:-ws://213.4.160.121:8080/ws}"
      EDGE_BCN_WS_URL: "${EDGE_BCN_WS_URL:-ws://213.4.161.52:8080/ws}"
      AWS_HTTPS_URL: "${AWS_HTTPS_URL:-https://ec2.eu-south-2.amazonaws.com/}"
      TEST_ROUNDS: "${TEST_ROUNDS:-500}"
      TEST_PACKET_SIZE: "${TEST_PACKET_SIZE:-64}"
      TEST_INTERVAL_MS: "${TEST_INTERVAL_MS:-100}"
      TEST_TIMEOUT_MS: "${TEST_TIMEOUT_MS:-2000}"
      TEST_WARMUPS: "${TEST_WARMUPS:-5}"
      AWS_TEST_ROUNDS: "${AWS_TEST_ROUNDS:-10}"
      AWS_TEST_INTERVAL_MS: "${AWS_TEST_INTERVAL_MS:-5000}"
      PORT: "80"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
